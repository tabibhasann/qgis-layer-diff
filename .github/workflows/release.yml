name: Release Plugin

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install qgis-plugin-ci
      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r dist/qgis_layer_diff.zip . -x ".git/*" "test/*" ".github/*" ".commandcode/*"
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/qgis_layer_diff.zip
          generate_release_notes: true
